<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cải tiến giao diện Shopee</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>Gợi ý hôm nay</h1>
    </header>
    
    <main class="product-grid">
        <!-- Sản phẩm 1 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/300?random=1" alt="Sản phẩm 1">
            <div class="product-info">
                <h3 class="product-name">Áo Thun Nam Form Rộng Cổ Tròn</h3>
                <p class="product-price">150.000 ₫</p>
                <button class="buy-btn">Thêm vào giỏ hàng</button>
            </div>
        </div>

        <!-- Sản phẩm 2 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/300?random=2" alt="Sản phẩm 2">
            <div class="product-info">
                <h3 class="product-name">Giày Thể Thao Nam Nữ Kiểu Dáng Trẻ Trung</h3>
                <p class="product-price">250.000 ₫</p>
                <button class="buy-btn">Thêm vào giỏ hàng</button>
            </div>
        </div>

        <!-- Sản phẩm 3 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/300?random=3" alt="Sản phẩm 3">
            <div class="product-info">
                <h3 class="product-name">Balo Thời Trang Chống Nước</h3>
                <p class="product-price">199.000 ₫</p>
                <button class="buy-btn">Thêm vào giỏ hàng</button>
            </div>
        </div>

        <!-- Sản phẩm 4 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/300?random=4" alt="Sản phẩm 4">
            <div class="product-info">
                <h3 class="product-name">Tai Nghe Bluetooth Không Dây</h3>
                <p class="product-price">350.000 ₫</p>
                <button class="buy-btn">Thêm vào giỏ hàng</button>
            </div>
        </div>
    </main>
</body>
</html>
